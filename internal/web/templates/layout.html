{{define "nav"}}
<header>
  <h1>PLC Monitoring</h1>
  <nav>
    {{$page := .Page}}
    {{range .Nav}}<a href="{{.Href}}" {{if eq .Key $page}}class="active"{{end}}>{{.Label}}</a>{{end}}
  </nav>
  <nav class="account-nav">
    <a href="/login" {{if eq .Page "login"}}class="active"{{end}}>{{if .User}}{{.User.Username}}{{else}}Log in{{end}}</a>
  </nav>
</header>
{{end}}
